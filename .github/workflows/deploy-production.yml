name: Deploy Production

# Tag-triggered, not push-to-main — a semver tag (v1.2.3) is the actual release; main advancing on
# its own no longer deploys anything (docs/deployment.md). release-please.yml cuts these tags and
# dispatches this workflow directly (workflow_dispatch) once a release PR is merged; the push
# trigger below remains as a fallback for a tag pushed by a human directly (e.g. a hotfix).
on:
  push:
    # GitHub Actions tag filters are glob, not regex — [0-9]* means "one digit then anything",
    # which correctly absorbs multi-digit version components (v10.25.3 still matches).
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Tag push + workflow_dispatch only, no pull_request trigger — bare deploy-tier label is fine.
    runs-on: [self-hosted, deploy]
    environment:
      name: production
      url: https://odograph.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno install

      - name: Generate Cloudflare runtime types
        run: deno task cf-typegen

      - name: fmt, lint, typecheck, test
        run: deno task check

      - name: build
        run: deno task build:production

      # Idempotent — only applies migrations not already applied, safe to run
      # on every deploy.
      - name: Apply D1 migrations (production)
        run: deno task migrate:production

      - name: Deploy to Cloudflare Workers (production)
        run: deno task deploy:production
