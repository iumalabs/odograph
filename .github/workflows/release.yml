name: Release

# Daily semver release cuts, automated (docs/deployment.md). If main has any new commits since the
# last release tag, creates a new tag/GitHub Release from them — that tag push is what actually
# triggers deploy-production.yml, so this workflow is what turns "code merged to main" into "code
# live in production," on a bounded daily cadence rather than per-merge.
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history — needed to diff against the last release tag

      - name: Determine last release tag
        id: last_tag
        run: |
          LAST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No prior release tag found (expected v1.0.0 to already exist) — nothing to bump from." >&2
            exit 1
          fi
          echo "tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check for new commits since last release
        id: check
        run: |
          COUNT=$(git rev-list "${{ steps.last_tag.outputs.tag }}"..HEAD --count)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$COUNT new commit(s) since ${{ steps.last_tag.outputs.tag }}"

      # Conventional-commit prefixes on the SUBJECT line decide the bump: any breaking-change
      # marker (`feat!:`/`fix!:`/etc., or a `BREAKING CHANGE` footer anywhere in the body) -> major;
      # else any `feat:`/`feat(scope):` -> minor; else (fix/docs/ci/chore/anything else) -> patch.
      # This project's own commit style (see git-workflow skill) doesn't mandate conventional-commit
      # prefixes, so the common case is "no feat:, no breaking marker" -> patch, which is the
      # correct conservative default for an unlabeled change.
      - name: Determine version bump and new tag
        if: steps.check.outputs.count != '0'
        id: bump
        run: |
          LAST_TAG="${{ steps.last_tag.outputs.tag }}"
          VERSION="${LAST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          FULL_LOG=$(git log "$LAST_TAG"..HEAD --pretty=%B)

          BUMP="patch"
          if echo "$FULL_LOG" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' || echo "$FULL_LOG" | grep -q "BREAKING CHANGE"; then
            BUMP="major"
          elif echo "$FULL_LOG" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP="minor"
          fi

          case "$BUMP" in
            major) NEW_TAG="v$((MAJOR + 1)).0.0" ;;
            minor) NEW_TAG="v${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bumping $LAST_TAG -> $NEW_TAG ($BUMP)"

      - name: Create release
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.new_tag }}" \
            --target main \
            --title "${{ steps.bump.outputs.new_tag }}" \
            --generate-notes \
            --notes-start-tag "${{ steps.last_tag.outputs.tag }}"
