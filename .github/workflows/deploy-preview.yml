name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    # Only PRs from branches in this repo get an auto-deployed preview — a fork PR's
    # secrets exposure is a separate trust decision, not something to default to open.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}-odograph-preview.kgz.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno install

      - name: Generate Cloudflare runtime types
        run: deno task cf-typegen

      - name: fmt, lint, typecheck, test
        run: deno task check

      - name: build
        run: deno task build:preview

      # Idempotent — only applies migrations not already applied, safe to run
      # on every deploy. Shared across all open PRs, same as the preview D1
      # database itself (see docs/deployment.md).
      - name: Apply D1 migrations (preview)
        run: deno task migrate:preview

      # A Worker Version, not a separate named Worker — every PR uploads a new version of the
      # single `odograph-preview` Worker, none of them promoted to serve default traffic
      # (`wrangler versions deploy` is what would do that, and nothing in this project calls it
      # for preview). --preview-alias gives a URL that's stable across every push to the same PR,
      # rather than a version-id that changes on each upload.
      - name: Upload preview version to Cloudflare Workers
        run: |
          deno task versions:upload:preview \
            --preview-alias pr-${{ github.event.pull_request.number }} \
            --message "PR #${{ github.event.pull_request.number }}"

      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        with:
          script: |
            const url = `https://pr-${context.issue.number}-odograph-preview.kgz.workers.dev`;
            const marker = "<!-- odograph-preview-url -->";
            const body = `${marker}\n🚀 Preview deployed: ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
