name: Auto-merge release PR

# release-please.yml only ever prepares a release PR — merging it is what actually ships a release.
# This is the "каждодневные релизы" half: once daily (plus on-demand), auto-merge whatever release
# PR is currently open, so a release ships without anyone having to remember to click merge.
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-automerge
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Find and merge the open release-please PR
        env:
          # Same PAT as release-please.yml, for the same reason: the merge commit this step
          # produces has to trigger release-please.yml again (so it notices the release PR was
          # merged and actually cuts the tag) — a push made with the default GITHUB_TOKEN can't
          # trigger other workflows.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No pending release PR — nothing to release today."
            exit 0
          fi
          echo "Merging release PR #$PR"
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash
