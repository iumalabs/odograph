name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, lint, typecheck, test, build
    # ci.yml triggers on an unrestricted pull_request (any fork) on this public repo, so
    # runs-on must fall back to a GitHub-hosted runner for fork PRs and only use the
    # self-hosted general tier for same-repo PRs/pushes to main (see RUNBOOK.md).
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "general"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno install

      - name: Generate Cloudflare runtime types
        run: deno task cf-typegen

      - name: fmt, lint, typecheck, test
        run: deno task check

      - name: build
        run: deno task build
