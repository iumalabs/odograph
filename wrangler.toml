name = "odograph"
main = "./src/server/index.ts"
compatibility_date = "2025-04-01"

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"

[observability]
enabled = true

# Once daily — every reminder interval this feature supports is measured in days/weeks/months,
# never minutes/hours, so this keeps a reminder never more than about a day stale between
# scheduled checks without invoking the Worker far more often than that could ever need (see
# specs/011-reminder-rules-cron/research.md).
[triggers]
crons = ["0 8 * * *"]

[vars]
ENVIRONMENT = "development"

# Local dev/test reuse the preview D1 database and KV namespace (Miniflare
# never calls the remote API for these, so this is safe reuse rather than a
# redundant third resource — see specs/001-tenant-session-foundation/research.md).
[[d1_databases]]
binding = "DB"
database_name = "odograph-preview"
database_id = "a55a25d1-0270-44e7-8d85-ae4873626ca7"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSION_CACHE"
id = "eaf8958e040049ecbe52408b28fa1d1c"

[[send_email]]
name = "EMAIL"

# Not yet provisioned on the account — see specs/007-service-record-crud/quickstart.md. Local
# dev/test use Miniflare's local R2 simulation regardless of whether the real bucket exists.
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "odograph-preview-attachments"

# The default (top-level) config above is used by `wrangler dev` for local
# iteration. CI deploys always pass an explicit environment — see
# docs/deployment.md. There is no supported local `wrangler deploy` path.

[env.preview]
name = "odograph-preview"
# Per-PR deploys override this with `--name odograph-pr-<PR number>` in
# deploy-preview.yml; this base name only applies if --name is omitted.

[env.preview.observability]
enabled = true

[env.preview.triggers]
crons = ["0 8 * * *"]

[env.preview.vars]
ENVIRONMENT = "preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "odograph-preview"
database_id = "a55a25d1-0270-44e7-8d85-ae4873626ca7"
migrations_dir = "migrations"

[[env.preview.kv_namespaces]]
binding = "SESSION_CACHE"
id = "eaf8958e040049ecbe52408b28fa1d1c"

[[env.preview.send_email]]
name = "EMAIL"

[[env.preview.r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "odograph-preview-attachments"

[env.production]
name = "odograph"
routes = [{ pattern = "odograph.dev", custom_domain = true }]

[env.production.observability]
enabled = true

[env.production.triggers]
crons = ["0 8 * * *"]

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "odograph-production"
database_id = "d8bcd8f6-3521-487d-aa78-8b7a075ef372"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "SESSION_CACHE"
id = "aa415e9f6b9646d2ba2318090008c0f8"

[[env.production.send_email]]
name = "EMAIL"

[[env.production.r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "odograph-production-attachments"
